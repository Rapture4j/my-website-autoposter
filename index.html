<!DOCTYPE html>
<html>
<head>
  <title>Samuel Altar - Health & Business</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>body{font-family:sans-serif;max-width:700px;margin:40px auto;padding:20px;line-height:1.6} a{color:#1877F2} li{margin-bottom:12px}</style>
</head>
<body>
  <h1>Welcome to My Journey</h1>
  <p>I help busy people stay healthy and build extra income. Follow for daily tips.</p>
  <h2>Latest Articles</h2>
  <ul id="posts">Loading...</ul>
  <p><a href="rss.xml">RSS Feed</a></p>
<script>
fetch('rss.xml').then(r=>r.text()).then(str=>{
  let xml = new window.DOMParser().parseFromString(str, "text/xml");
  let items = xml.querySelectorAll("item");
  let html="";
  items.forEach(i=>{
    html+=`<li><a href="${i.querySelector("link").textContent}"><b>${i.querySelector("title").textContent}</b></a> - ${i.querySelector("description").textContent}</li>`
  });
  document.getElementById("posts").innerHTML=html;
})
</script>
</body>
</html>
